<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bar Katmandu · TPV</title>
<style>
  :root{
    --negro:#1b1f24;
    --azul:#16324f;
    --azul-suave:#1f4468;
    --naranja:#e08a34;
    --naranja-suave:#f5c98f;
    --crema:#faf6ee;
    --ticket-bg:#fdf3cf;
    --verde:#3f7d5c;
    --rojo:#c0392b;
    --gris:#7b8794;
    --linea:#e5ddc4;
    --sombra:0 2px 8px rgba(22,50,79,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--negro);
    color:var(--azul);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ===== HEADER (barra de información estilo TPV) ===== */
  header{
    background:var(--negro);
    color:#fff;
    padding:8px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
    gap:16px;
    border-bottom:3px solid var(--naranja);
    z-index:5;
  }
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand .palm{font-size:26px;}
  header h1{font-size:19px;margin:0;letter-spacing:1px;font-weight:800;text-transform:uppercase;}
  header .sub{font-size:10.5px;color:var(--naranja-suave);margin-top:-2px;display:block;}

  header .info-bar{
    display:flex;
    gap:22px;
    font-size:12px;
    color:#cfd8e3;
    flex-wrap:wrap;
  }
  header .info-bar .campo b{display:block;color:#fff;font-size:13px;font-weight:700;}
  header .info-bar .campo span.etq{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--naranja-suave);}

  header .mesa-box{display:flex;align-items:center;gap:8px;}
  header input#mesa{
    width:130px;padding:8px 10px;border-radius:6px;border:none;font-size:13px;
  }
  header label{font-size:11px;color:var(--naranja-suave);}
  header .btn-carta{
    background:var(--naranja);border:none;color:white;padding:8px 12px;border-radius:6px;
    font-size:11.5px;cursor:pointer;font-weight:700;white-space:nowrap;
  }

  /* ===== LAYOUT PRINCIPAL ===== */
  .app{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* ---- IZQUIERDA: Comanda / Ticket en curso ---- */
  main#ticket-panel{
    flex:1.15;
    display:flex;
    flex-direction:column;
    background:var(--ticket-bg);
    min-width:0;
    border-right:1px solid var(--linea);
  }
  .ticket-head{
    background:var(--azul);
    color:white;
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
  }
  .ticket-head h2{margin:0;font-size:15px;}
  .ticket-head button{
    background:none;border:1px solid var(--naranja-suave);color:var(--naranja-suave);
    font-size:11px;cursor:pointer;padding:5px 10px;border-radius:5px;font-weight:700;
  }
  .ticket-cols{
    display:grid;
    grid-template-columns:1fr 70px 96px 76px 34px;
    gap:4px;
    padding:8px 12px;
    font-size:11px;
    font-weight:700;
    color:var(--gris);
    text-transform:uppercase;
    letter-spacing:.4px;
    border-bottom:2px solid var(--azul);
    flex-shrink:0;
  }
  .ticket-cols span.der{text-align:right;}
  #lista-carrito{
    flex:1;
    overflow-y:auto;
    padding:2px 8px;
  }
  .item-carrito{
    display:grid;
    grid-template-columns:1fr 70px 96px 76px 34px;
    align-items:center;
    gap:4px;
    padding:9px 4px;
    border-bottom:1px solid var(--linea);
  }
  .item-carrito .nombre{font-size:13px;font-weight:700;line-height:1.2;}
  .item-carrito .nombre .sub{display:block;font-size:10.5px;font-weight:400;color:var(--gris);}
  .item-carrito .precio-ud{font-size:12px;color:var(--gris);}
  .item-carrito .qty-ctrl{display:flex;align-items:center;justify-content:center;gap:5px;}
  .item-carrito .qty-ctrl button{
    width:24px;height:24px;border-radius:5px;border:1px solid #d8cfa8;background:white;font-size:14px;cursor:pointer;line-height:1;
  }
  .item-carrito .qty-ctrl span{min-width:16px;text-align:center;font-size:13px;font-weight:700;}
  .item-carrito .linea-precio{font-size:13.5px;font-weight:800;text-align:right;color:var(--azul);}
  .item-carrito .borrar{color:var(--rojo);font-size:16px;cursor:pointer;text-align:center;padding:2px;}
  #carrito-vacio{padding:40px 16px;text-align:center;color:var(--gris);font-size:13px;}

  #totales{
    padding:12px 14px 14px;
    border-top:2px solid var(--azul);
    background:#fffaf0;
    flex-shrink:0;
  }
  #totales .fila{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--gris);}
  #totales .fila.total{font-size:20px;font-weight:800;color:var(--azul);margin-top:4px;margin-bottom:10px;}
  .botones-fin{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-fin{
    padding:14px 6px;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    letter-spacing:.3px;
    color:white;
  }
  .btn-fin.imprimir{background:var(--verde);}
  .btn-fin.cancelar{background:var(--rojo);}
  .btn-fin:disabled{background:#c8c8c8;cursor:not-allowed;}
  .btn-fin:active{opacity:0.85;}

  /* ---- DERECHA: Categorías (mosaico de color) + productos ---- */
  aside#panel-productos{
    width:46%;
    max-width:620px;
    background:#eef1f4;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    min-width:340px;
  }
  nav#cats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    padding:10px;
    flex-shrink:0;
    max-height:38%;
    overflow-y:auto;
    background:white;
    border-bottom:2px solid var(--azul);
  }
  nav#cats button{
    border:none;
    border-radius:8px;
    color:white;
    font-size:12.5px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.3px;
    cursor:pointer;
    min-height:64px;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:var(--sombra);
    filter:brightness(0.92);
    line-height:1.2;
  }
  nav#cats button.active{
    outline:3px solid var(--negro);
    outline-offset:-3px;
    filter:brightness(1.08);
  }

  main#productos{
    flex:1;
    overflow-y:auto;
    padding:12px;
    min-height:0;
  }
  main#productos h2{
    margin:0 0 10px 2px;
    font-size:15px;
    color:var(--azul);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
    gap:10px;
  }
  .card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:var(--sombra);
    cursor:pointer;
    user-select:none;
    display:flex;
    flex-direction:column;
    transition:transform .08s ease;
    border:2px solid transparent;
  }
  .card:active{transform:scale(0.96);border-color:var(--naranja);}
  .card .foto{
    width:100%;
    height:72px;
    background-size:cover;
    background-position:center;
    background-color:var(--naranja-suave);
  }
  .card .info{padding:7px 8px 9px;flex:1;display:flex;flex-direction:column;}
  .card .nombre{font-size:12px;font-weight:700;line-height:1.2;}
  .card .desc{font-size:10px;color:var(--gris);margin-top:2px;flex:1;}
  .card .precio{font-size:13px;font-weight:800;color:var(--naranja);margin-top:5px;}

  /* MENU FOTO ORIGINAL (modal) */
  #modal-menu{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  #modal-menu.abierto{display:flex;}
  #modal-menu .contenido{
    background:white;border-radius:10px;max-width:95%;max-height:95%;overflow:auto;padding:10px;position:relative;
  }
  #modal-menu img{max-width:100%;display:block;margin-bottom:10px;border-radius:6px;}
  #modal-menu .cerrar{
    position:absolute;top:8px;right:10px;background:var(--rojo);color:white;border:none;
    width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;
  }

  /* TICKET (solo visible al imprimir) */
  #ticket{display:none;}

  @media print{
    body *{visibility:hidden;}
    #ticket, #ticket *{visibility:visible;}
    #ticket{
      display:block;
      position:absolute;top:0;left:0;width:280px;
      font-family:'Courier New', monospace;
      color:#000;
      padding:6px;
    }
    #ticket h1{font-size:16px;text-align:center;margin:0 0 2px;}
    #ticket .centro{text-align:center;}
    #ticket hr{border:none;border-top:1px dashed #000;margin:6px 0;}
    #ticket table{width:100%;border-collapse:collapse;font-size:12px;}
    #ticket td{padding:2px 0;}
    #ticket .der{text-align:right;}
    #ticket .grande{font-size:15px;font-weight:bold;}
  }

  @media (max-width:900px){
    aside#panel-productos{width:340px;}
    header .info-bar{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="palm">🌴</span>
    <div>
      <h1>Bar Katmandu</h1>
      <span class="sub">Terminal de pedidos · TPV</span>
    </div>
  </div>

  <div class="info-bar">
    <div class="campo"><span class="etq">Fecha</span><b id="info-fecha">-</b></div>
    <div class="campo"><span class="etq">Hora</span><b id="info-hora">-</b></div>
    <div class="campo"><span class="etq">Ticket nº</span><b id="info-ticket">-</b></div>
  </div>

  <div class="mesa-box">
    <button class="btn-carta" onclick="abrirMenuFotos()">📋 Ver carta escaneada</button>
    <label for="mesa">Mesa/Cliente</label>
    <input id="mesa" type="text" placeholder="Ej. Mesa 4">
  </div>
</header>

<div class="app">

  <main id="ticket-panel">
    <div class="ticket-head">
      <h2>🧾 Comanda</h2>
      <button onclick="vaciarCarrito()">Vaciar</button>
    </div>
    <div class="ticket-cols">
      <span>Producto</span><span class="der">Precio</span><span style="text-align:center;">Cant.</span><span class="der">Total</span><span></span>
    </div>
    <div id="lista-carrito"></div>
    <div id="totales">
      <div class="fila"><span>Artículos</span><span id="total-articulos">0</span></div>
      <div class="fila total"><span>TOTAL</span><span id="total-precio">0.00 €</span></div>
      <div class="botones-fin">
        <button class="btn-fin imprimir" id="btn-imprimir" onclick="imprimirTicket()" disabled>🖨️ Finalizar / Ticket</button>
        <button class="btn-fin cancelar" onclick="vaciarCarrito()">✕ Cancelar comanda</button>
      </div>
    </div>
  </main>

  <aside id="panel-productos">
    <nav id="cats"></nav>
    <main id="productos">
      <h2 id="titulo-categoria"></h2>
      <div class="grid" id="grid-productos"></div>
    </main>
  </aside>

</div>

<!-- Modal con las fotos originales de la carta -->
<div id="modal-menu">
  <div class="contenido">
    <button class="cerrar" onclick="cerrarMenuFotos()">✕</button>
    <img src="img/bebidas-1.jpg" alt="Carta de bebidas Bar Katmandu">
    <img src="img/comida-1.jpg" alt="Carta de comida Bar Katmandu">
  </div>
</div>

<!-- ZONA DE IMPRESIÓN DEL TICKET -->
<div id="ticket">
  <h1>BAR KATMANDU</h1>
  <div class="centro">Terraza · Verano</div>
  <div class="centro" id="tk-fecha"></div>
  <hr>
  <div id="tk-mesa"></div>
  <div id="tk-numero"></div>
  <hr>
  <table id="tk-lineas"></table>
  <hr>
  <table>
    <tr><td>Artículos</td><td class="der" id="tk-articulos"></td></tr>
    <tr class="grande"><td>TOTAL</td><td class="der" id="tk-total"></td></tr>
  </table>
  <hr>
  <div class="centro">¡Gracias por su visita!</div>
</div>

<script>
/* ==========================================================
   DATOS DE LA CARTA
   (Editar aquí precios, nombres o añadir/quitar productos)
   Las fotos viven en la carpeta img/ del repositorio,
   junto a este index.html (misma estructura que en GitHub).
   ========================================================== */
const MENU = {
  "Cócteles": { color:"#c0392b", foto:"img/cocktails.jpg", items:[
    {n:"Screw Driver", d:"Vodka orange", p:6.90},
    {n:"Cuba Libre", d:"Rum, lemon & coke", p:5.90},
    {n:"Gin & Tonic", p:7.50},
    {n:"Vodka Margarita", p:7.50},
  ]},
  "Aperitivos": { color:"#e08a34", foto:"img/aperitivos.jpg", items:[
    {n:"Campari Spritz", p:8.90},
    {n:"Aperol Spritz", p:8.90},
    {n:"Tinto Verano", p:2.95},
    {n:"Vermut", p:3.40},
  ]},
  "Sangría": { color:"#a13d63", foto:"img/sangria.jpg", items:[
    {n:"Sangría Copa", p:5.95},
    {n:"Sangría Copa Cava", p:6.95},
    {n:"Sangría Jarra", p:14.50},
    {n:"Sangría Jarra Cava", p:17.50},
  ]},
  "Vino": { color:"#8e44ad", foto:"img/vino.jpg", items:[
    {n:"Vino Rosado", p:3.90},
    {n:"Vino Blanco", p:3.95},
    {n:"Vino Tinto", p:3.50},
    {n:"Cava", p:0, editable:true},
  ]},
  "Cerveza": { color:"#c98a12", foto:"img/cerveza.jpg", items:[
    {n:"Estrella Galicia Copa", p:2.95},
    {n:"Estrella Galicia Jarra", p:5.90},
    {n:"Estrella Damm", p:2.95},
    {n:"Voll Damm", p:3.05},
    {n:"Clara Copa", p:2.95},
    {n:"Clara Jarra", p:5.00},
  ]},
  "Refrescos": { color:"#2471a3", foto:"img/refrescos.jpg", items:[
    {n:"Cola", p:2.90},
    {n:"Cola Zero", p:2.90},
    {n:"Fanta Naranja", p:2.90},
    {n:"Fanta Limón", p:2.90},
    {n:"Sprite", p:2.90},
    {n:"Nestea", p:2.90},
    {n:"Aquarius", p:2.90},
    {n:"Agua", p:1.95},
    {n:"Agua con gas", p:2.50},
    {n:"Red Bull", p:2.95},
    {n:"Tónica", p:2.50},
  ]},
  "Tequila Shots": { color:"#16a085", foto:"img/tequila.jpg", items:[
    {n:"Tequila Shot", p:0, editable:true},
  ]},
  "Tapas": { color:"#3f7d5c", foto:"img/tapas1.jpg", items:[
    {n:"Onion Pakauda", d:"Cebolla rebozada, salsas caseras", p:4.95},
    {n:"Egg Pakauda", d:"Huevo cocido frito rebozado", p:4.95},
    {n:"French Fries", p:5.95},
    {n:"Aloo Sandheko", d:"Patatas con especias", p:4.95},
    {n:"Aloo Jira", d:"Patata cúmina", p:4.95},
    {n:"Bara Pollo", d:"Tortita de lenteja, huevo y carne", p:4.95},
  ]},
  "Barbacoa Nepalí": { color:"#6d4c2f", foto:"img/barbacoa.jpg", items:[
    {n:"Chwela", p:6.95},
    {n:"Secuwa", p:6.95},
    {n:"Pork Chilli", p:5.95},
    {n:"Chicken Chilli", p:5.95},
  ]},
  "Momos": { color:"#b9770e", foto:"img/momofried.jpg", items:[
    {n:"Momo Choices (vapor)", d:"Pollo, cerdo o verduras", p:5.95},
    {n:"Momo Fried / Jhol", p:6.95},
    {n:"Momo Picante", p:6.95},
    {n:"Momo Mix (9pc)", d:"Pollo, cerdo y verduras", p:9.95},
  ]},
  "Platos Principales": { color:"#1f4468", foto:"img/curryrice.jpg", items:[
    {n:"Arroz Verduras, Pollo, Cerdo", p:9.95},
    {n:"Katmandu Curry Rice", d:"Pollo, cerdo y verduras", p:11.95},
    {n:"Wai Wai Thukpa", d:"Fideos estilo ramen nepalí", p:7.50},
    {n:"Chicken Secuwa", d:"Brocheta marinada a la parrilla", p:11.95},
    {n:"Chewala", d:"Crujiente, especias y verduras frescas", p:11.95},
  ]},
  "Postres": { color:"#8e6b8e", foto:"", items:[
    {n:"Rice Pudding", p:3.95},
  ]},
};

let categoriaActual = Object.keys(MENU)[0];
let carrito = []; // {n, p, qty}

/* ---------- construir navegación (mosaico de categorías) ---------- */
const catsNav = document.getElementById('cats');
Object.keys(MENU).forEach(cat=>{
  const b = document.createElement('button');
  b.textContent = cat;
  b.style.background = MENU[cat].color || 'var(--azul)';
  b.onclick = ()=>{ categoriaActual = cat; render(); };
  b.dataset.cat = cat;
  catsNav.appendChild(b);
});

function render(){
  // mosaico activo
  [...catsNav.children].forEach(b=> b.classList.toggle('active', b.dataset.cat===categoriaActual));

  document.getElementById('titulo-categoria').textContent = categoriaActual;
  const grid = document.getElementById('grid-productos');
  grid.innerHTML = '';
  MENU[categoriaActual].items.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card';
    const foto = MENU[categoriaActual].foto;
    card.innerHTML = `
      <div class="foto" style="${foto ? `background-image:url('${foto}')` : `display:flex;align-items:center;justify-content:center;font-size:30px;`}">${foto? '' : '🍮'}</div>
      <div class="info">
        <div class="nombre">${item.n}</div>
        ${item.d ? `<div class="desc">${item.d}</div>` : ''}
        <div class="precio">${item.editable ? 'Precio libre' : item.p.toFixed(2)+' €'}</div>
      </div>`;
    card.onclick = ()=> agregarAlCarrito(item);
    grid.appendChild(card);
  });
}

function agregarAlCarrito(item){
  let precio = item.p;
  if(item.editable){
    const val = prompt(`Precio para "${item.n}" (€):`, "");
    if(val===null) return;
    precio = parseFloat(val.replace(',','.'));
    if(isNaN(precio)||precio<0){ alert('Precio no válido'); return; }
  }
  const existente = carrito.find(c=> c.n===item.n && c.p===precio);
  if(existente){ existente.qty++; }
  else { carrito.push({n:item.n, p:precio, qty:1}); }
  renderCarrito();
}

function cambiarQty(idx, delta){
  carrito[idx].qty += delta;
  if(carrito[idx].qty<=0) carrito.splice(idx,1);
  renderCarrito();
}

function borrarLinea(idx){
  carrito.splice(idx,1);
  renderCarrito();
}

function vaciarCarrito(){
  if(carrito.length && !confirm('¿Vaciar toda la comanda?')) return;
  carrito = [];
  renderCarrito();
}

function renderCarrito(){
  const lista = document.getElementById('lista-carrito');
  lista.innerHTML = '';
  if(carrito.length===0){
    lista.innerHTML = '<div id="carrito-vacio">La comanda está vacía.<br>Toca un producto de la derecha para añadirlo.</div>';
  } else {
    carrito.forEach((c, idx)=>{
      const div = document.createElement('div');
      div.className = 'item-carrito';
      div.innerHTML = `
        <div class="nombre">${c.n}<span class="sub">${c.p.toFixed(2)} € / ud</span></div>
        <div class="precio-ud der" style="text-align:right;">${c.p.toFixed(2)}€</div>
        <div class="qty-ctrl">
          <button onclick="cambiarQty(${idx},-1)">−</button>
          <span>${c.qty}</span>
          <button onclick="cambiarQty(${idx},1)">+</button>
        </div>
        <div class="linea-precio">${(c.p*c.qty).toFixed(2)}€</div>
        <div class="borrar" onclick="borrarLinea(${idx})">🗑</div>
      `;
      lista.appendChild(div);
    });
  }
  const totalArticulos = carrito.reduce((s,c)=>s+c.qty,0);
  const totalPrecio = carrito.reduce((s,c)=>s+c.qty*c.p,0);
  document.getElementById('total-articulos').textContent = totalArticulos;
  document.getElementById('total-precio').textContent = totalPrecio.toFixed(2)+' €';
  document.getElementById('btn-imprimir').disabled = carrito.length===0;
}

/* ---------- reloj e info de cabecera ---------- */
function actualizarInfoBar(){
  const ahora = new Date();
  document.getElementById('info-fecha').textContent = ahora.toLocaleDateString('es-ES');
  document.getElementById('info-hora').textContent = ahora.toLocaleTimeString('es-ES');
  const siguiente = parseInt(localStorage.getItem('katmandu_ticket_num')||'0',10) + 1;
  document.getElementById('info-ticket').textContent = String(siguiente).padStart(4,'0');
}
setInterval(actualizarInfoBar, 1000);

/* ---------- ticket / impresión ---------- */
function siguienteNumeroTicket(){
  let n = parseInt(localStorage.getItem('katmandu_ticket_num')||'0',10) + 1;
  localStorage.setItem('katmandu_ticket_num', n);
  return n;
}

function imprimirTicket(){
  if(carrito.length===0) return;
  const mesa = document.getElementById('mesa').value.trim();
  const num = siguienteNumeroTicket();
  const ahora = new Date();
  document.getElementById('tk-fecha').textContent = ahora.toLocaleDateString('es-ES') + '  ' + ahora.toLocaleTimeString('es-ES');
  document.getElementById('tk-mesa').textContent = mesa ? ('Mesa/Cliente: '+mesa) : '';
  document.getElementById('tk-numero').textContent = 'Ticket nº: ' + String(num).padStart(4,'0');

  const tabla = document.getElementById('tk-lineas');
  tabla.innerHTML = '';
  carrito.forEach(c=>{
    const fila = document.createElement('tr');
    fila.innerHTML = `<td>${c.qty}x ${c.n}</td><td class="der">${(c.p*c.qty).toFixed(2)}€</td>`;
    tabla.appendChild(fila);
  });

  const totalArticulos = carrito.reduce((s,c)=>s+c.qty,0);
  const totalPrecio = carrito.reduce((s,c)=>s+c.qty*c.p,0);
  document.getElementById('tk-articulos').textContent = totalArticulos;
  document.getElementById('tk-total').textContent = totalPrecio.toFixed(2)+' €';

  window.print();
}

// tras imprimir (o cancelar impresión), preguntamos si se cobró para vaciar la comanda
window.onafterprint = function(){
  if(confirm('¿Comanda cobrada? Se vaciará el TPV para el siguiente pedido.')){
    carrito = [];
    document.getElementById('mesa').value='';
    renderCarrito();
  }
};

/* ---------- modal carta escaneada ---------- */
function abrirMenuFotos(){ document.getElementById('modal-menu').classList.add('abierto'); }
function cerrarMenuFotos(){ document.getElementById('modal-menu').classList.remove('abierto'); }

render();
renderCarrito();
actualizarInfoBar();
</script>
</body>
