<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bar Katmandu · TPV</title>
<style>
  :root{
    --azul:#16324f;
    --azul-suave:#1f4468;
    --naranja:#e08a34;
    --naranja-suave:#f5c98f;
    --crema:#faf6ee;
    --verde:#3f7d5c;
    --rojo:#c0392b;
    --gris:#7b8794;
    --sombra:0 2px 8px rgba(22,50,79,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--crema);
    color:var(--azul);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* HEADER */
  header{
    background:var(--azul);
    color:white;
    padding:10px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
    box-shadow:var(--sombra);
    z-index:5;
  }
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand .palm{font-size:24px;}
  header h1{font-size:20px;margin:0;letter-spacing:1px;font-weight:800;text-transform:uppercase;}
  header .sub{font-size:11px;color:var(--naranja-suave);margin-top:-2px;display:block;}
  header .mesa-box{display:flex;align-items:center;gap:6px;}
  header input#mesa{
    width:110px;padding:8px 10px;border-radius:6px;border:none;font-size:14px;
  }
  header label{font-size:12px;color:var(--naranja-suave);}

  /* LAYOUT */
  .app{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* CATEGORY NAV */
  nav#cats{
    width:150px;
    background:var(--azul-suave);
    overflow-y:auto;
    flex-shrink:0;
  }
  nav#cats button{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:white;
    padding:14px 12px;
    font-size:13.5px;
    cursor:pointer;
    border-left:4px solid transparent;
    font-weight:600;
  }
  nav#cats button.active{
    background:var(--crema);
    color:var(--azul);
    border-left:4px solid var(--naranja);
  }
  nav#cats button:hover:not(.active){background:rgba(255,255,255,0.08);}

  /* PRODUCT GRID */
  main#productos{
    flex:1;
    overflow-y:auto;
    padding:14px;
  }
  main#productos h2{
    margin:0 0 12px 2px;
    font-size:18px;
    color:var(--azul);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:12px;
  }
  .card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:var(--sombra);
    cursor:pointer;
    user-select:none;
    display:flex;
    flex-direction:column;
    transition:transform .08s ease;
    border:2px solid transparent;
  }
  .card:active{transform:scale(0.96);border-color:var(--naranja);}
  .card .foto{
    width:100%;
    height:88px;
    background-size:cover;
    background-position:center;
    background-color:var(--naranja-suave);
  }
  .card .info{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;}
  .card .nombre{font-size:13px;font-weight:700;line-height:1.25;}
  .card .desc{font-size:11px;color:var(--gris);margin-top:2px;flex:1;}
  .card .precio{font-size:14px;font-weight:800;color:var(--naranja);margin-top:6px;}

  /* CART */
  aside#carrito{
    width:300px;
    background:white;
    border-left:1px solid #e5ddd0;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
  }
  aside#carrito .cab{
    padding:12px 14px;
    background:var(--azul);
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  aside#carrito .cab h2{margin:0;font-size:15px;}
  aside#carrito .cab button{
    background:none;border:none;color:var(--naranja-suave);font-size:12px;cursor:pointer;text-decoration:underline;
  }
  #lista-carrito{
    flex:1;
    overflow-y:auto;
    padding:8px 10px;
  }
  .item-carrito{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 4px;
    border-bottom:1px solid #f0ece2;
  }
  .item-carrito .nombre{flex:1;font-size:13px;font-weight:600;}
  .item-carrito .sub{font-size:11px;color:var(--gris);}
  .item-carrito .qty-ctrl{display:flex;align-items:center;gap:4px;}
  .item-carrito .qty-ctrl button{
    width:24px;height:24px;border-radius:5px;border:1px solid #ddd;background:var(--crema);font-size:14px;cursor:pointer;line-height:1;
  }
  .item-carrito .qty-ctrl span{min-width:16px;text-align:center;font-size:13px;font-weight:700;}
  .item-carrito .linea-precio{font-size:13px;font-weight:700;width:52px;text-align:right;}
  .item-carrito .borrar{color:var(--rojo);font-size:16px;cursor:pointer;padding:2px 4px;}
  #carrito-vacio{padding:30px 16px;text-align:center;color:var(--gris);font-size:13px;}

  #totales{
    padding:12px 16px;
    border-top:2px solid var(--azul);
  }
  #totales .fila{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--gris);}
  #totales .fila.total{font-size:19px;font-weight:800;color:var(--azul);margin-top:6px;}
  .btn-imprimir{
    width:100%;
    margin-top:10px;
    padding:14px;
    background:var(--verde);
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    letter-spacing:.5px;
  }
  .btn-imprimir:active{opacity:0.85;}
  .btn-imprimir:disabled{background:#c8c8c8;cursor:not-allowed;}

  /* MENU FOTO ORIGINAL (modal) */
  #modal-menu{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  #modal-menu.abierto{display:flex;}
  #modal-menu .contenido{
    background:white;border-radius:10px;max-width:95%;max-height:95%;overflow:auto;padding:10px;position:relative;
  }
  #modal-menu img{max-width:100%;display:block;margin-bottom:10px;border-radius:6px;}
  #modal-menu .cerrar{
    position:absolute;top:8px;right:10px;background:var(--rojo);color:white;border:none;
    width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;
  }

  /* TICKET (solo visible al imprimir) */
  #ticket{display:none;}

  @media print{
    body *{visibility:hidden;}
    #ticket, #ticket *{visibility:visible;}
    #ticket{
      display:block;
      position:absolute;top:0;left:0;width:280px;
      font-family:'Courier New', monospace;
      color:#000;
      padding:6px;
    }
    #ticket h1{font-size:16px;text-align:center;margin:0 0 2px;}
    #ticket .centro{text-align:center;}
    #ticket hr{border:none;border-top:1px dashed #000;margin:6px 0;}
    #ticket table{width:100%;border-collapse:collapse;font-size:12px;}
    #ticket td{padding:2px 0;}
    #ticket .der{text-align:right;}
    #ticket .grande{font-size:15px;font-weight:bold;}
  }

  @media (max-width:820px){
    aside#carrito{width:250px;}
    nav#cats{width:110px;}
    nav#cats button{font-size:12px;padding:12px 8px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="palm">🌴</span>
    <div>
      <h1>Bar Katmandu</h1>
      <span class="sub">Terminal de pedidos · TPV</span>
    </div>
  </div>
  <div class="mesa-box">
    <button onclick="abrirMenuFotos()" style="background:var(--naranja);border:none;color:white;padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:700;">📋 Ver carta escaneada</button>
    <label for="mesa">Mesa/Cliente</label>
    <input id="mesa" type="text" placeholder="Ej. Mesa 4">
  </div>
</header>

<div class="app">
  <nav id="cats"></nav>

  <main id="productos">
    <h2 id="titulo-categoria"></h2>
    <div class="grid" id="grid-productos"></div>
  </main>

  <aside id="carrito">
    <div class="cab">
      <h2>🧾 Comanda</h2>
      <button onclick="vaciarCarrito()">Vaciar</button>
    </div>
    <div id="lista-carrito"></div>
    <div id="totales">
      <div class="fila"><span>Artículos</span><span id="total-articulos">0</span></div>
      <div class="fila total"><span>TOTAL</span><span id="total-precio">0.00 €</span></div>
      <button class="btn-imprimir" id="btn-imprimir" onclick="imprimirTicket()" disabled>🖨️ Sacar ticket</button>
    </div>
  </aside>
</div>

<!-- Modal con las fotos originales de la carta -->
<div id="modal-menu">
  <div class="contenido">
    <button class="cerrar" onclick="cerrarMenuFotos()">✕</button>
    <img src="images/bebidas-1.jpg" alt="Carta de bebidas Bar Katmandu">
    <img src="images/comida-1.jpg" alt="Carta de comida Bar Katmandu">
  </div>
</div>

<!-- ZONA DE IMPRESIÓN DEL TICKET -->
<div id="ticket">
  <h1>BAR KATMANDU</h1>
  <div class="centro">Terraza · Verano</div>
  <div class="centro" id="tk-fecha"></div>
  <hr>
  <div id="tk-mesa"></div>
  <div id="tk-numero"></div>
  <hr>
  <table id="tk-lineas"></table>
  <hr>
  <table>
    <tr><td>Artículos</td><td class="der" id="tk-articulos"></td></tr>
    <tr class="grande"><td>TOTAL</td><td class="der" id="tk-total"></td></tr>
  </table>
  <hr>
  <div class="centro">¡Gracias por su visita!</div>
</div>

<script>
/* ==========================================================
   DATOS DE LA CARTA
   (Editar aquí precios, nombres o añadir/quitar productos)
   ========================================================== */
const MENU = {
  "Cócteles": { foto:"images/cocktails.jpg", items:[
    {n:"Screw Driver", d:"Vodka orange", p:6.90},
    {n:"Cuba Libre", d:"Rum, lemon & coke", p:5.90},
    {n:"Gin & Tonic", p:7.50},
    {n:"Vodka Margarita", p:7.50},
  ]},
  "Aperitivos": { foto:"images/aperitivos.jpg", items:[
    {n:"Campari Spritz", p:8.90},
    {n:"Aperol Spritz", p:8.90},
    {n:"Tinto Verano", p:2.95},
    {n:"Vermut", p:3.40},
  ]},
  "Sangría": { foto:"images/sangria.jpg", items:[
    {n:"Sangría Copa", p:5.95},
    {n:"Sangría Copa Cava", p:6.95},
    {n:"Sangría Jarra", p:14.50},
    {n:"Sangría Jarra Cava", p:17.50},
  ]},
  "Vino": { foto:"images/vino.jpg", items:[
    {n:"Vino Rosado", p:3.90},
    {n:"Vino Blanco", p:3.95},
    {n:"Vino Tinto", p:3.50},
    {n:"Cava", p:0, editable:true},
  ]},
  "Cerveza": { foto:"images/cerveza.jpg", items:[
    {n:"Estrella Galicia Copa", p:2.95},
    {n:"Estrella Galicia Jarra", p:5.90},
    {n:"Estrella Damm", p:2.95},
    {n:"Voll Damm", p:3.05},
    {n:"Clara Copa", p:2.95},
    {n:"Clara Jarra", p:5.00},
  ]},
  "Refrescos": { foto:"images/refrescos.jpg", items:[
    {n:"Cola", p:2.90},
    {n:"Cola Zero", p:2.90},
    {n:"Fanta Naranja", p:2.90},
    {n:"Fanta Limón", p:2.90},
    {n:"Sprite", p:2.90},
    {n:"Nestea", p:2.90},
    {n:"Aquarius", p:2.90},
    {n:"Agua", p:1.95},
    {n:"Agua con gas", p:2.50},
    {n:"Red Bull", p:2.95},
    {n:"Tónica", p:2.50},
  ]},
  "Tequila Shots": { foto:"images/tequila.jpg", items:[
    {n:"Tequila Shot", p:0, editable:true},
  ]},
  "Tapas": { foto:"images/tapas1.jpg", items:[
    {n:"Onion Pakauda", d:"Cebolla rebozada, salsas caseras", p:4.95},
    {n:"Egg Pakauda", d:"Huevo cocido frito rebozado", p:4.95},
    {n:"French Fries", p:5.95},
    {n:"Aloo Sandheko", d:"Patatas con especias", p:4.95},
    {n:"Aloo Jira", d:"Patata cúmina", p:4.95},
    {n:"Bara Pollo", d:"Tortita de lenteja, huevo y carne", p:4.95},
  ]},
  "Barbacoa Nepalí": { foto:"images/barbacoa.jpg", items:[
    {n:"Chwela", p:6.95},
    {n:"Secuwa", p:6.95},
    {n:"Pork Chilli", p:5.95},
    {n:"Chicken Chilli", p:5.95},
  ]},
  "Momos": { foto:"images/momofried.jpg", items:[
    {n:"Momo Choices (vapor)", d:"Pollo, cerdo o verduras", p:5.95},
    {n:"Momo Fried / Jhol", p:6.95},
    {n:"Momo Picante", p:6.95},
    {n:"Momo Mix (9pc)", d:"Pollo, cerdo y verduras", p:9.95},
  ]},
  "Platos Principales": { foto:"images/curryrice.jpg", items:[
    {n:"Arroz Verduras, Pollo, Cerdo", p:9.95},
    {n:"Katmandu Curry Rice", d:"Pollo, cerdo y verduras", p:11.95},
    {n:"Wai Wai Thukpa", d:"Fideos estilo ramen nepalí", p:7.50},
    {n:"Chicken Secuwa", d:"Brocheta marinada a la parrilla", p:11.95},
    {n:"Chewala", d:"Crujiente, especias y verduras frescas", p:11.95},
  ]},
  "Postres": { foto:"", items:[
    {n:"Rice Pudding", p:3.95},
  ]},
};

let categoriaActual = Object.keys(MENU)[0];
let carrito = []; // {n, p, qty}

/* ---------- construir navegación ---------- */
const catsNav = document.getElementById('cats');
Object.keys(MENU).forEach(cat=>{
  const b = document.createElement('button');
  b.textContent = cat;
  b.onclick = ()=>{ categoriaActual = cat; render(); };
  b.dataset.cat = cat;
  catsNav.appendChild(b);
});

function render(){
  // nav activo
  [...catsNav.children].forEach(b=> b.classList.toggle('active', b.dataset.cat===categoriaActual));

  document.getElementById('titulo-categoria').textContent = categoriaActual;
  const grid = document.getElementById('grid-productos');
  grid.innerHTML = '';
  MENU[categoriaActual].items.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card';
    const foto = MENU[categoriaActual].foto;
    card.innerHTML = `
      <div class="foto" style="${foto ? `background-image:url('${foto}')` : `display:flex;align-items:center;justify-content:center;font-size:34px;`}">${foto? '' : '🍮'}</div>
      <div class="info">
        <div class="nombre">${item.n}</div>
        ${item.d ? `<div class="desc">${item.d}</div>` : ''}
        <div class="precio">${item.editable ? 'Precio libre' : item.p.toFixed(2)+' €'}</div>
      </div>`;
    card.onclick = ()=> agregarAlCarrito(item);
    grid.appendChild(card);
  });
}

function agregarAlCarrito(item){
  let precio = item.p;
  if(item.editable){
    const val = prompt(`Precio para "${item.n}" (€):`, "");
    if(val===null) return;
    precio = parseFloat(val.replace(',','.'));
    if(isNaN(precio)||precio<0){ alert('Precio no válido'); return; }
  }
  const existente = carrito.find(c=> c.n===item.n && c.p===precio);
  if(existente){ existente.qty++; }
  else { carrito.push({n:item.n, p:precio, qty:1}); }
  renderCarrito();
}

function cambiarQty(idx, delta){
  carrito[idx].qty += delta;
  if(carrito[idx].qty<=0) carrito.splice(idx,1);
  renderCarrito();
}

function borrarLinea(idx){
  carrito.splice(idx,1);
  renderCarrito();
}

function vaciarCarrito(){
  if(carrito.length && !confirm('¿Vaciar toda la comanda?')) return;
  carrito = [];
  renderCarrito();
}

function renderCarrito(){
  const lista = document.getElementById('lista-carrito');
  lista.innerHTML = '';
  if(carrito.length===0){
    lista.innerHTML = '<div id="carrito-vacio">La comanda está vacía.<br>Toca un producto para añadirlo.</div>';
  } else {
    carrito.forEach((c, idx)=>{
      const div = document.createElement('div');
      div.className = 'item-carrito';
      div.innerHTML = `
        <div style="flex:1;">
          <div class="nombre">${c.n}</div>
          <div class="sub">${c.p.toFixed(2)} € / ud</div>
        </div>
        <div class="qty-ctrl">
          <button onclick="cambiarQty(${idx},-1)">−</button>
          <span>${c.qty}</span>
          <button onclick="cambiarQty(${idx},1)">+</button>
        </div>
        <div class="linea-precio">${(c.p*c.qty).toFixed(2)}€</div>
        <div class="borrar" onclick="borrarLinea(${idx})">🗑</div>
      `;
      lista.appendChild(div);
    });
  }
  const totalArticulos = carrito.reduce((s,c)=>s+c.qty,0);
  const totalPrecio = carrito.reduce((s,c)=>s+c.qty*c.p,0);
  document.getElementById('total-articulos').textContent = totalArticulos;
  document.getElementById('total-precio').textContent = totalPrecio.toFixed(2)+' €';
  document.getElementById('btn-imprimir').disabled = carrito.length===0;
}

/* ---------- ticket / impresión ---------- */
function siguienteNumeroTicket(){
  let n = parseInt(localStorage.getItem('katmandu_ticket_num')||'0',10) + 1;
  localStorage.setItem('katmandu_ticket_num', n);
  return n;
}

function imprimirTicket(){
  if(carrito.length===0) return;
  const mesa = document.getElementById('mesa').value.trim();
  const num = siguienteNumeroTicket();
  const ahora = new Date();
  document.getElementById('tk-fecha').textContent = ahora.toLocaleDateString('es-ES') + '  ' + ahora.toLocaleTimeString('es-ES');
  document.getElementById('tk-mesa').textContent = mesa ? ('Mesa/Cliente: '+mesa) : '';
  document.getElementById('tk-numero').textContent = 'Ticket nº: ' + String(num).padStart(4,'0');

  const tabla = document.getElementById('tk-lineas');
  tabla.innerHTML = '';
  carrito.forEach(c=>{
    const fila = document.createElement('tr');
    fila.innerHTML = `<td>${c.qty}x ${c.n}</td><td class="der">${(c.p*c.qty).toFixed(2)}€</td>`;
    tabla.appendChild(fila);
  });

  const totalArticulos = carrito.reduce((s,c)=>s+c.qty,0);
  const totalPrecio = carrito.reduce((s,c)=>s+c.qty*c.p,0);
  document.getElementById('tk-articulos').textContent = totalArticulos;
  document.getElementById('tk-total').textContent = totalPrecio.toFixed(2)+' €';

  window.print();
}

// tras imprimir (o cancelar impresión), preguntamos si se cobró para vaciar la comanda
window.onafterprint = function(){
  if(confirm('¿Comanda cobrada? Se vaciará el TPV para el siguiente pedido.')){
    carrito = [];
    document.getElementById('mesa').value='';
    renderCarrito();
  }
};

/* ---------- modal carta escaneada ---------- */
function abrirMenuFotos(){ document.getElementById('modal-menu').classList.add('abierto'); }
function cerrarMenuFotos(){ document.getElementById('modal-menu').classList.remove('abierto'); }

render();
renderCarrito();
</script>
</body>
</html>
